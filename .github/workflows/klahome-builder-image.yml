name: KLAHOME Builder image

# Builds and pushes the self-hosted Webstudio Builder image to GHCR.
# This is KLAHOME-specific CI, kept in the fork (not upstream). The
# docker-compose stack in KLAHOME/IaC pins the resulting digest, matching
# the "digest-pinned images" convention used by every other stack there.

on:
  push:
    branches:
      - klahome/nextcloud-oidc-auth
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/klahome/webstudio-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
